<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Seleksi Pelatihan Menjahit</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

.info{
    background:#eef5ff;
    border:1px solid #cfdfff;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}

.question{
    margin-bottom:25px;
}

.option{
    display:block;
    margin:8px 0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    cursor:pointer;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h1>Tes Seleksi Pelatihan Menjahit</h1>

<div class="info">
Tes ini mengukur pemahaman dasar peserta mengenai:
<ul>
<li>Pengoperasian mesin jahit</li>
<li>Keselamatan dan kesehatan kerja (K3)</li>
<li>Tes praktik mengikuti garis jahitan</li>
<li>Alat dan bahan menjahit</li>
<li>Dasar pola dan kualitas jahitan</li>
</ul>
</div>

<form id="quizForm"></form>

<button type="button" onclick="cekNilai()">
Kirim Jawaban
</button>

<div id="result"></div>

</div>

<script>

},

{
pertanyaan:"Saat tes mengikuti garis lengkung, peserta harus?",
opsi:{

},
jawaban:"c"
},

{
pertanyaan:"Jika hasil jahitan sering keluar dari garis pola, hal ini menunjukkan?",

c:"Benang terlalu panjang",

},

},

{
pertanyaan:"Tujuan tes memasang benang pada mesin jahit adalah menilai?",

a:"Kecepatan dan pemahaman dasar mesin",

c:"Kemampuan menghitung",
d:"Kekuatan fisik"
},
jawaban:"a"
},

{
pertanyaan:"Menginjak pedal terlalu mendadak dapat menyebabkan?",

},

},

{

opsi:{
a:"Paling cepat",

},
jawaban:"c"
},

{
pertanyaan:"Saat memasang benang, jalur benang harus?",
opsi:{
a:"Mengikuti jalur mesin",

c:"Bebas",

},

},

{

jawaban:"a"
},

{

},

{

},

},

{
pertanyaan:"Alat yang paling tepat untuk memberi tanda pola pada kain adalah?",
opsi:{
a:"Tang",
b:"Obeng",
c:"Kapur jahit",
d:"Palu"
},
jawaban:"c"
},

{
pertanyaan:"Fungsi jarum pentul adalah?",
opsi:{
a:"Menahan posisi kain sementara",
b:"Memotong kain",
c:"Mengukur kain",

},

},

{

{

opsi:{

d:"Mengganti benang"
},
jawaban:"a"
},

{
pertanyaan:"Area kerja menjahit harus bersih karena?",
opsi:{

{

opsi:{

{

opsi:{

{

opsi:{

d:"Mengurangi warna kain"

const form = document.getElementById("quizForm");

soal.forEach((s,index)=>{

let html = `
<div class="question">
<p><b>${index+1}. ${s.pertanyaan}</b></p>

<label class="option">
<input type="radio" name="q${index}" value="a">
${s.opsi.a}
</label>

<label class="option">
<input type="radio" name="q${index}" value="b">
${s.opsi.b}
</label>

<label class="option">
<input type="radio" name="q${index}" value="c">
${s.opsi.c}
</label>

<label class="option">
<input type="radio" name="q${index}" value="d">
${s.opsi.d}
</label>

</div>
`;

form.innerHTML += html;

});

function cekNilai(){

let skor = 0;

soal.forEach((s,index)=>{

let pilih =
document.querySelector(`input[name="q${index}"]:checked`);

if(pilih && pilih.value === s.jawaban){
skor++;
}

});

let nilai = Math.round((skor / soal.length) * 100);

document.getElementById("result").innerHTML =
`Nilai Anda: ${nilai}<br>Benar ${skor} dari ${soal.length} soal`;

}

</script>

</body>
</html>
